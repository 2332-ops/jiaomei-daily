# ============================================================================
# wxpush 配置示例
#
# 复制一份改名为 config.yaml 再改。凭证一律用环境变量，别写明文。
#
# Windows 永久设置环境变量（设完必须重开终端才生效）：
#     setx WECOM_CORPID "ww1234567890abcdef"
# macOS / Linux：
#     echo 'export WECOM_CORPID="ww1234..."' >> ~/.bashrc && source ~/.bashrc
# ============================================================================

# ---------------------------- 分发模式 ----------------------------
# all         所有启用通道都发，任一成功即整体成功（推荐，多通道冗余）
# failover    按顺序发，第一个成功就停（省额度）
# require_all 必须全部成功，否则判定失败
mode: "all"

# ---------------------------- 网络 ----------------------------
network:
  timeout_connect: 6         # 连接超时（秒）
  timeout_read: 15           # 读取超时（秒）
  # 本机若配了 HTTP_PROXY/HTTPS_PROXY 环境变量，而代理连不通目标域名，
  # 自动切换为直连重试一次。企业内网环境常见问题，建议保持 true。
  auto_disable_proxy: true
  # 强制指定代理，例如 "http://127.0.0.1:7890"；不填则跟随环境变量
  proxies: null

# ---------------------------- 重试 ----------------------------
retry:
  attempts: 4                # 总尝试次数（含首次）
  base: 1                    # 首次退避秒数，后续 2/4/8...
  cap: 30                    # 指数退避的单次上限
  jitter: 0.35               # 抖动量，避免多通道同时重试再次被限流
  # 平台明确给出冷却时间（如企业微信限流要求等 60 秒）时，最多愿意等多久。
  # 这个值和 cap 分开：若被 cap=30 截断，30 秒后重试必然再被拒，纯浪费一次机会。
  retry_after_cap: 120

# ---------------------------- token 缓存 ----------------------------
# 企业微信/公众号的 access_token 有效期 7200 秒，且"频繁重新获取会让上一个失效"。
# 必须缓存，否则程序跑一段时间后会出现周期性 40014。
token_cache:
  path: "data/tokens.json"
  safety_margin: 300         # 提前 300 秒刷新

# ---------------------------- 发送去重（防重复推送）----------------------------
# 计划任务被重跑、调度器崩溃补跑时，避免同一条消息推两遍。
dedup:
  enabled: false
  path: "data/send_dedup.json"
  ttl_seconds: 1800

# ============================================================================
# 通道列表。enabled: false 的会被完全跳过。
# ============================================================================
channels:

  # --------------------------------------------------------------------------
  # 【推荐①】企业微信自建应用 —— 唯一能"推给指定微信账号"的官方方式
  #
  # 申请步骤：
  #   1. 企业微信后台 → 我的企业 → 企业信息 → 复制「企业ID」→ WECOM_CORPID
  #   2. 应用管理 → 自建 → 创建应用 → 复制「Secret」→ WECOM_SECRET
  #      （AgentId 就在同一页，是一个数字）
  #   3. 该应用 → 「可见范围」把目标成员加进去（漏了会报 60011）
  #   4. 应用 → 「企业可信IP」加上服务器出口 IP
  #   5. **成员需在微信里关注「企业微信插件」**，否则消息只到企业微信 App：
  #      企业微信 App → 我 → 设置 → 新消息通知 → 微信插件 → 扫码关注
  #
  # 群机器人 vs 自建应用 怎么选：
  #   只想给自己 / 一个小群发 → 群机器人（只需一个 URL，30 秒搞定）
  #   要精确发给某人、按部门发、或需要"应用"级的消息归属 → 自建应用
  # --------------------------------------------------------------------------
  - type: wecom_app
    enabled: false
    name: "发给我自己"
    corpid: "${WECOM_CORPID}"
    corpsecret: "${WECOM_SECRET}"
    agentid: "${WECOM_AGENTID}"
    touser: "ZhangSan"            # 成员账号（UserID），多个用 | 分隔，如 "ZhangSan|LiSi"
    # toparty: "1|2"              # 按部门发（与 touser 可同时用，取并集）
    # totag: "1"                  # 按标签发
    # touser: "@all"              # 发给全部成员（谨慎，会打扰所有人）
    msg_type: "text"              # text | markdown（markdown 不支持 @）
    safe: 0                       # 1=保密消息，内容会加水印且不能转发
    enable_duplicate_check: false # 开启后，同一内容短时间内重复推送会被平台丢弃
    duplicate_check_interval: 1800

  # --------------------------------------------------------------------------
  # 【推荐②】企业微信群机器人 —— 推到群聊，配置最简单
  #
  # 群聊 → 右上角「...」→ 群机器人 → 添加机器人 → 复制 Webhook 地址
  # 想"发给自己"？建一个只有自己的群即可，效果等同于个人推送。
  # --------------------------------------------------------------------------
  - type: wecom_bot
    enabled: false
    name: "运维群"
    webhook: "${WECOM_WEBHOOK}"   # https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
    # 也可以只填 key，两种写法等价：
    # key: "693a91f6-7xxx-4bc4-97a0-0ec2sifa5aaa"
    msg_type: "markdown"          # text | markdown
    # @成员（仅 text 类型生效；@all 表示所有人）
    mentioned_list: []
    # mentioned_list: ["@all"]
    # mentioned_list: ["wangqing", "zhangsan"]
    # mentioned_mobile_list: ["13800001111", "@all"]

  # --------------------------------------------------------------------------
  # 【推荐③】PushPlus —— 推到个人微信，零门槛
  # 到 https://www.pushplus.plus 微信扫码登录 → 复制 token
  # 想推给多人 → 后台建「群组」，把编码填到 topic
  # --------------------------------------------------------------------------
  - type: pushplus
    enabled: false
    name: "我的微信"
    token: "${PUSHPLUS_TOKEN}"
    template: "markdown"          # html | txt | json | markdown
    # topic: "群组编码"           # 一对多：群组内所有人都会收到
    # to: "好友的token"           # 一对一：发给指定好友
    # channel: "wechat"           # 默认微信；可选 webhook / mail / cp / sms

  # --------------------------------------------------------------------------
  # 【推荐④】QQ 机器人 —— 推到 QQ 群 / QQ 单聊（QQ 开放平台官方接口）
  # 到 https://q.qq.com 注册开发者 → 创建机器人 → 拿 AppID / AppSecret
  #
  # 三条硬限制（平台的，不是本模块的）：
  #   1. 正式环境**主动消息要求机器人已上线**，未上线会报 code=40034102"主动消息失败, 无权限"
  #      → 开发期先设 sandbox: true，沙箱不受此限
  #   2. 用户可以单方面关掉「允许主动发送」，关掉后必然失败且返回里不会说明原因
  #   3. 频控：群主动消息 20 条/分钟/关系，每群每天最多接收 1000 条
  #
  # group_openid / user_openid **不是 QQ 号、无法反查**，只能由平台在事件里下发：
  # 把机器人加进群后 @ 它一次，用 tools/qq_fetch_openid.py 抓出来。
  # --------------------------------------------------------------------------
  - type: qq_bot
    enabled: false
    name: "我的QQ群"
    appid: "${QQ_BOT_APPID}"
    clientsecret: "${QQ_BOT_SECRET}"
    group_openid: "${QQ_BOT_GROUP_OPENID}"     # 发到群（与 user_openid 二选一）
    # user_openid: "${QQ_BOT_USER_OPENID}"     # 发到单聊
    sandbox: false            # 开发期先设 true（沙箱不校验 IP 白名单、无需上线）
    msg_type: "text"          # text(0) | markdown(2)
    # msg_id: "..."           # 被动回复用（5 分钟内有效，不占主动消息额度）

  # --------------------------------------------------------------------------
  # Server 酱 Turbo —— 同样是推到个人微信
  # 到 https://sct.ftqq.com 微信扫码登录 → 复制 SendKey
  # 注意：单 key 有频率限制，本模块已内置 12 秒最小间隔
  # --------------------------------------------------------------------------
  - type: serverchan
    enabled: false
    name: "我的微信(备)"
    sendkey: "${SERVERCHAN_KEY}"
    # channel: 9                  # 9=服务号模板消息（默认）
    tags: []                      # 标签，便于在服务号里筛选

  # --------------------------------------------------------------------------
  # 微信公众号模板消息 —— 推给指定微信用户
  # ⚠️ 需要**认证服务号**，个人订阅号没有这个接口权限。
  #    如果你只是"想收到消息"，用 pushplus / serverchan 就够，不必折腾这个。
  # --------------------------------------------------------------------------
  - type: wechat_mp
    enabled: false
    name: "公众号推送"
    appid: "${MP_APPID}"
    secret: "${MP_SECRET}"
    openid: "${MP_OPENID}"        # 接收者的 openid（该用户需已关注此公众号）
    template_id: "${MP_TEMPLATE_ID}"
    url: ""                       # 点击消息跳转链接，可空
    field_limit: 200              # 每个模板字段截断到多少字符
    data_fields:                  # 模板字段映射，{title} {text} {date} {summary} 会被替换
      first: "{title}"
      keyword1: "{date}"
      keyword2: "{summary}"
      remark: "{text}"

  # --------------------------------------------------------------------------
  # 控制台通道 —— 只在本机打印，不走网络
  # 第一次部署时建议先只开它，确认文案、分片、去重都对了再接真实通道。
  # 也可以临时用 `--only console` 强制只走它。
  # --------------------------------------------------------------------------
  - type: console
    enabled: false
    name: "本机调试"
