# ============================================================================
# 消息推送配置
#
# 当前启用：QQ 机器人（消息进你的 QQ 群 / QQ 单聊，官方接口）
# 已实测不可用：PushPlus（905 未实名，实名收费）
# 实测走不通：WorkBuddy 自动化界面**没有**「微信推送」开关（只有「同步到 WorkBuddy
#            微信小程序」和「同步到企业微信 bot」两个），所以自动化结果推不进个人微信。
#            想让程序把报告送出去，只能靠本文件里的通道。
#
# 凭证统一走环境变量，不写进本文件 —— 配置文件太容易跟着代码一起被传走。
# ⚠️ setx 对**已打开**的终端不生效，设完必须重开终端/重新登录。
# ============================================================================

mode: all

channels:
  # --------------------------------------------------------------------------
  # 【已实测：暂时不可用，故关闭】PushPlus —— 消息推到你的微信
  #
  # ⚠️ PushPlus 自 2024-08-01 起实行**网站实名制**，未实名账号调 /send 一律返回
  #    code=905，**token 完全正确也发不出去**。实测原始返回：
  #    {"code":905,"data":"未实名认证用户无法发送消息。实名地址：https://verify.pushplus.plus",
  #     "msg":"账户未进行实名认证"}
  #    注意 905 是"未实名认证"，不是"未绑定微信" —— 别再去反复核对 token。
  #    实名认证是**收费**的（¥3.9 一次性，或开通一个月会员可免费实名，一次认证终身有效）。
  #
  # 想用它：先去 https://verify.pushplus.plus 完成实名，再把下面 enabled 改成 true。
  # token 已配好（环境变量 PUSHPLUS_TOKEN 已写入用户环境）。
  # 不想付费实名：改用 serverchan（免费每天 5 条），或本文件里的 qq_bot 通道。
  # --------------------------------------------------------------------------
  - type: pushplus
    enabled: false
    name: "我的微信"
    token: "${PUSHPLUS_TOKEN}"
    template: "markdown"          # html | txt | json | markdown
    # topic: "群组编码"           # 一对多：群组内所有人都会收到
    # to: "好友的token"           # 一对一：发给指定好友

  # --------------------------------------------------------------------------
  # 【当前启用】QQ 机器人 —— QQ 群 / QQ 单聊（QQ 开放平台官方接口）
  #
  # 本机已完成：
  #   ✅ 机器人「焦煤日报」已创建（AppID 1905676597，robot_uin 4013842071）
  #   ✅ QQ_BOT_APPID / QQ_BOT_SECRET 已写入用户环境变量，实测能取到 access_token
  #   ✅ 本机公网 IP = 183.191.164.0（上线后要填进「开发设置」→ IP 白名单）
  #   ⬜ 还差 user_openid —— 它不是 QQ 号、无法反查，只能由平台在消息事件里下发
  #
  # 拿 user_openid 的步骤（**群场景平台不支持，只能走单聊**）：
  #   1. https://q.qq.com 机器人管理页 →「开发管理」→ 页内的「沙箱配置」区块
  #      （⚠️ 沙箱配置**不在左侧菜单**里，所以"左侧找不到"是正常的）
  #   2. 选「在消息列表配置」→「添加成员」填你自己的 QQ 号 → 用手机 QQ 扫码添加机器人
  #      （只添加成员不够，必须扫码，否则聊天里会提示"该机器人去火星了"）
  #   3. 在 QQ 里给机器人发一句话
  #   4. python tools/qq_fetch_openid.py --sandbox --once
  #   5. setx QQ_BOT_USER_OPENID "抓到的值"，重开终端
  #
  # ⚠️ 正式环境发**主动消息要求机器人已上线**，未上线会报
  #    code=40034102「主动消息失败, 无权限」。开发期先在沙箱实测主动推送能否通过。
  # ⚠️ 正式环境还要在「开发管理」→「IP 白名单」加上本机公网 IP，否则连不上网关；
  #    且新增机器人**不填 IP 白名单不能提审上线**（沙箱环境不受此限）。
  # ⚠️ 用户可以关掉「允许主动发送」，关掉后必然失败，且返回里不会说明原因。
  # --------------------------------------------------------------------------
  - type: qq_bot
    enabled: true
    name: "焦煤日报QQ单聊"
    appid: "${QQ_BOT_APPID}"
    clientsecret: "${QQ_BOT_SECRET}"
    # ⚠️ 2026-09-25 实测 + 平台文档/多方教程一致：**QQ 开放平台不支持机器人的
    #    「在 QQ 群配置」**，新创建的机器人只能走「消息列表单聊」(C2C)。
    #    所以这里用 user_openid，不用 group_openid。
    user_openid: "${QQ_BOT_USER_OPENID}"
    # group_openid: "${QQ_BOT_GROUP_OPENID}"   # 群场景当前不可用，留作以后平台放开
    sandbox: true                 # ⚠️ 开发期必须 true；机器人上线后改 false（正式环境还要配 IP 白名单）
    msg_type: "text"              # text(0) | markdown(2)

# ---------------------------------------------------------------------------
# 重试：只对"可重试"错误生效（网络抖动、限流、5xx）
# 凭证错误属永久错误 —— 不会浪费重试次数，立即失败并如实报告
# ---------------------------------------------------------------------------
retry:
  attempts: 4                # 总尝试次数（含首次）
  base: 1                    # 首次退避秒数，之后 2/4/8…
  cap: 30                    # 单次退避上限（秒）
  jitter: 0.35               # 抖动，避免多通道同时重试再次撞限流
  retry_after_cap: 120       # 平台明确给出冷却时间时的上限

network:
  timeout_connect: 6
  timeout_read: 15
  auto_disable_proxy: true   # 本机代理连不上目标域名时，自动重试一次直连

# ---------------------------------------------------------------------------
# 发送去重：同一 dedup-key 在 TTL 内只发一次，防止计划任务重跑导致重复推送
# 用 --dedup-key "2026-09-25|market_close" 传入
# ---------------------------------------------------------------------------
dedup:
  enabled: true
  path: "data/send_dedup.json"
  ttl_seconds: 1800
