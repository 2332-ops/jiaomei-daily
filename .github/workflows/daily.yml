name: 焦煤日报

# 触发方式有三种：
#   1) 定时（正式推送）：周一至周五，北京时间 09:35 / 10:00 / 15:02
#      —— 法定节假日由程序内部的交易日守卫（行情时间戳）自动跳过，不需要维护日历
#   2) 手动 workflow_dispatch：可选手动跑「正式推送」或「只做诊断」
#   3) 推送代码（push 到 main）：自动跑一次【诊断】，不发日报，
#      用来确认云端到底能不能取数、凭证是否有效（诊断结果同时写进 status/ 并发到 QQ）
#
# cron 是 UTC，北京时间 = UTC + 8：
#   01:35 UTC = 09:35 北京（开盘）
#   02:00 UTC = 10:00 北京（上午十点）
#   07:02 UTC = 15:02 北京（收盘）
on:
  schedule:
    - cron: '35 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '2 7 * * 1-5'
  workflow_dispatch:
    inputs:
      slot:
        description: '要跑的时段'
        type: choice
        required: true
        default: 'market_close'
        options:
          - market_open
          - morning_ten
          - market_close
      mode:
        description: '运行方式'
        type: choice
        required: true
        default: '正式推送'
        options:
          - '正式推送'
          - '只做诊断'
  push:
    branches: [main]
    paths-ignore:
      - 'status/**'

# 需要写权限：每次运行后把运行状态回写到 status/ 目录，
# 这样不接触运行日志也能从仓库里看到最近一次跑成什么样。
permissions:
  contents: write

concurrency:
  group: jiaomei-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 状态回写要在完整历史上 rebase，浅克隆会出错

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 行情/资金流/发送日志存在 SQLite 里（含"近5日主力合计"的本地累积）。
      # GitHub 的 runner 是一次性的，用 Actions 缓存把数据库带过去，
      # key 带 run_id 保证每次运行后都会存一份新快照，restore-keys 恢复最近一份。
      - name: 恢复行情数据库
        uses: actions/cache@v4
        with:
          path: jiaomei_tracker/data
          key: tracker-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tracker-data-v1-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 凭证从仓库 Secrets 生成 .env（wechat_pusher 启动时自动读取，
      # 真实环境变量优先，不会覆盖 Secrets 注入的值）。.env 永远不进 git。
      - name: 生成凭证文件
        run: |
          printf 'QQ_BOT_APPID=%s\nQQ_BOT_SECRET=%s\nQQ_BOT_USER_OPENID=%s\n' \
            "${{ secrets.QQ_BOT_APPID }}" \
            "${{ secrets.QQ_BOT_SECRET }}" \
            "${{ secrets.QQ_BOT_USER_OPENID }}" > wechat_pusher/.env
          if grep -q '=$' wechat_pusher/.env; then
            echo "::error::存在空的 Secret，请到仓库 Settings -> Secrets and variables -> Actions 检查 QQ_BOT_APPID / QQ_BOT_SECRET / QQ_BOT_USER_OPENID 三个值是否都已填写"
            exit 1
          fi
          echo "凭证文件已生成（未回显内容，长度：$(wc -c < wechat_pusher/.env) 字节）"

      # 时段用**触发它的那条 cron 原文**来判定，而不是按当前时间猜：
      # 定时任务会有几分钟排队延迟，按时间猜会把 9:35 的开盘跑误判成"上午十点"。
      - name: 确定运行参数
        id: plan
        env:
          # 远程遥控用：推送代码时若 commit 信息里带 [正式推送]，就按正式模式出报，
          # 可用 [slot:market_open] / [slot:morning_ten] / [slot:market_close] 指定时段。
          # 不带标记的推送一律只做诊断，绝不会误发日报。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            '35 1 * * 1-5') SLOT=market_open ;;
            '0 2 * * 1-5')  SLOT=morning_ten ;;
            '2 7 * * 1-5')  SLOT=market_close ;;
            *) SLOT="${{ github.event.inputs.slot }}" ;;
          esac
          if [ -z "$SLOT" ]; then
            BJ=$(TZ=Asia/Shanghai date +%H%M)
            case "$BJ" in
              09*) SLOT=market_open ;;
              10*) SLOT=morning_ten ;;
              *)   SLOT=market_close ;;
            esac
          fi

          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "push" ]; then
            if printf '%s' "$COMMIT_MSG" | grep -q '\[正式推送\]'; then
              MODE='正式推送'
              case "$COMMIT_MSG" in
                *'[slot:market_open]'*)  SLOT=market_open ;;
                *'[slot:morning_ten]'*)  SLOT=morning_ten ;;
                *'[slot:market_close]'*) SLOT=market_close ;;
              esac
            else
              MODE='只做诊断'
            fi
          fi
          if [ -z "$MODE" ]; then MODE='正式推送'; fi
          if [ "$MODE" = '只做诊断' ]; then DIAG=yes; else DIAG=no; fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "diag=$DIAG" >> "$GITHUB_OUTPUT"
          echo "时段=$SLOT  方式=$MODE  触发=${{ github.event_name }}  北京时间=$(TZ=Asia/Shanghai date '+%F %T')"

      # 真取一次 access_token（不发消息）：同时验证「Secrets 配全了」和「云端能连上 QQ 接口」
      - name: 凭证自检
        id: selfcheck
        continue-on-error: true
        run: |
          set -o pipefail
          cd wechat_pusher
          python send.py --only qq_bot --check 2>&1 | tee /tmp/selfcheck.log

      # ---------- 诊断模式：只验链路，不发日报 ----------
      - name: 取数自检（dry-run，不发送、不落库）
        id: diyrun
        if: steps.plan.outputs.diag == 'yes'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd jiaomei_tracker
          python run.py --slot "${{ steps.plan.outputs.slot }}" --dry-run --force 2>&1 | tee /tmp/daily.log

      # 诊断只把结果写进 status/（上面那步），**不出错就不打扰用户**：
      # 只有凭证或取数确实失败时，才往 QQ 发一条告警。
      - name: 诊断失败才告警到 QQ
        if: steps.plan.outputs.diag == 'yes'
        continue-on-error: true
        run: |
          CRED_OK=$(grep -c '\[OK\]' /tmp/selfcheck.log 2>/dev/null || true)
          QUOTE_OK=$(grep -c '行情取数成功' /tmp/daily.log 2>/dev/null || true)
          if [ "$CRED_OK" -gt 0 ] && [ "$QUOTE_OK" -gt 0 ]; then
            echo "云端诊断通过（凭证与取数均正常），按设计不发送消息"
            exit 0
          fi
          BJ=$(TZ=Asia/Shanghai date '+%F %T')
          CRED=$(grep -v '^[[:space:]]*$' /tmp/selfcheck.log 2>/dev/null | tail -1)
          LAST=$(grep -v '^[[:space:]]*$' /tmp/daily.log 2>/dev/null | tail -1)
          {
            echo "时间：$BJ"
            echo "凭证自检：${CRED:-无输出}"
            echo "取数结果：${LAST:-无输出}"
            echo "（这是云端自检失败告警；正常时不会发消息）"
          } > /tmp/diag.txt
          cd wechat_pusher
          python send.py --only qq_bot --title "⚠️ 云端自检异常" --text "$(cat /tmp/diag.txt)"

      # ---------- 正式模式：正常出日报并推送 ----------
      - name: 运行日报（正式推送）
        id: run
        if: steps.plan.outputs.diag != 'yes'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd jiaomei_tracker
          python run.py --slot "${{ steps.plan.outputs.slot }}" 2>&1 | tee /tmp/daily.log

      # 把本次结果写回仓库。即使上一步失败也执行（if: always()），
      # 且自身失败不拖累整个任务（continue-on-error），只做诊断用。
      - name: 回写运行状态
        if: always()
        continue-on-error: true
        env:
          SLOT: ${{ steps.plan.outputs.slot }}
          DIAG: ${{ steps.plan.outputs.diag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p status
          BJ_NOW=$(TZ=Asia/Shanghai date '+%F %T')
          LAST_LINE=$(grep -v '^[[:space:]]*$' /tmp/daily.log 2>/dev/null | tail -1)
          CRED_LINE=$(grep -v '^[[:space:]]*$' /tmp/selfcheck.log 2>/dev/null | tail -1)
          {
            echo "北京时间: $BJ_NOW"
            echo "时段: ${SLOT:-未确定}"
            echo "方式: $([ "$DIAG" = "yes" ] && echo 诊断 || echo 正式推送)"
            echo "触发: ${{ github.event_name }}"
            echo "任务结果: ${{ job.status }}"
            echo "凭证自检: ${CRED_LINE:-（无输出）}"
            echo "末尾输出: ${LAST_LINE:-（无日志）}"
            echo "运行页: $RUN_URL"
          } > status/last-run.txt
          tail -n 40 /tmp/daily.log > status/last-log-tail.txt 2>/dev/null || true
          cp /tmp/diag.txt status/last-diag.txt 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          if git diff --cached --quiet; then
            echo "状态无变化，无需提交"
            exit 0
          fi
          git commit -q -m "运行状态 $SLOT $BJ_NOW"
          # 并发运行或人工推送会让远端前进，直接推会被拒 → 兜底 rebase 后重推
          if git push -q origin HEAD:main 2>/dev/null; then
            echo "状态已回写"
          else
            echo "推送被拒，改为 rebase 后重推"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            echo "状态已回写（rebase 兜底）"
          fi
