name: 焦煤日报

# 触发方式有三种：
#   1) 定时（正式推送）：周一至周五，北京时间 09:37 / 10:03 / 15:04
#      （刻意避开整点与整5分：官方提示整点为高负载时段，排队任务可能被丢弃）
#      —— 法定节假日由程序内部的交易日守卫（行情时间戳）自动跳过，不需要维护日历
#   2) 手动 workflow_dispatch：可选手动跑「正式推送」或「只做诊断」
#   3) 推送代码（push 到 main）：默认自动跑一次【诊断】，只写 status/、不发日报；
#      诊断发现凭证或取数异常时才往 QQ 发一条告警。见下方"远程补发"说明。
#
# 【远程补发】在 push 的 commit 信息里带标记可远程命令云端出报（标记带冒号，避免日常文字误撞）：
#   幂等补发: DAILY-SEND:market_close      → 立刻按正式模式出收盘报告；当天该时段已发过则自动跳过
#             DAILY-SEND:market_open / DAILY-SEND:morning_ten
#             可无脑重复触发，不会造成重复消息（适合做"保底补发"）
#   强制重发: DAILY-RESEND:market_close    → 跳过去重，明知会重复也照发
#   维护:     DAILY-RESET-DEDUP            → 清掉云端当日发送去重记录（不改行情历史）
#   ⚠️ 写 commit 信息时不要原样写出这些标记，否则会被误触发。
#
# ⚠️ 实测结论（2026-09-28）：本仓库的 GitHub schedule 定时器从未触发过，一次都没有。
#    证据：临时心跳工作流（cron 每 10 分钟一次、避开整点）在 main 上挂了约 80 分钟、
#    错过 8 个应触发窗口，零心跳提交；/actions/runs?event=schedule 的 total_count 始终为 0；
#    同期 push 触发 8 次、8 次全部在 30 秒内起跑。已排除程序、凭证、网络、默认分支等因素。
#    → 下方 cron 仅作为「免费兜底」保留：万一 GitHub 恢复调度它就会生效，
#      与外部定时器（cron-job.org 调 workflow_dispatch）并存也不会重复发送，
#      因为正式推送路径不带 --force，send_log 去重会挡住后到的那一次。
#    → 真正的定时靠外部唤醒，排查全过程见 MAINTENANCE.md。
#
# cron 是 UTC，北京时间 = UTC + 8：
#   01:37 UTC = 09:37 北京（开盘）
#   02:03 UTC = 10:03 北京（上午十点）
#   07:04 UTC = 15:04 北京（收盘）
on:
  schedule:
    # 全部避开整点与"整5分"：官方说明每个整点是高负载时段，排队中的定时任务可能被丢弃。
    # 代价是比目标时间晚 2~4 分钟，对行情日报无实质影响。
    - cron: '37 1 * * 1-5'    # 09:37 北京（开盘）
    - cron: '3 2 * * 1-5'     # 10:03 北京（上午十点）
    - cron: '4 7 * * 1-5'     # 15:04 北京（收盘）
  workflow_dispatch:
    inputs:
      slot:
        description: '要跑的时段'
        type: choice
        required: false        # 外部定时器调用时只传这个（或全不传走默认）
        default: 'market_close'
        options:
          - market_open
          - morning_ten
          - market_close
      mode:
        description: '运行方式'
        type: choice
        required: false        # 默认即「正式推送」，外部定时器无需传此参数
        default: '正式推送'
        options:
          - '正式推送'
          - '只做诊断'
  push:
    branches: [main]
    paths-ignore:
      - 'status/**'

# 需要写权限：每次运行后把运行状态回写到 status/ 目录，
# 这样不接触运行日志也能从仓库里看到最近一次跑成什么样。
permissions:
  contents: write

concurrency:
  group: jiaomei-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 状态回写要在完整历史上 rebase，浅克隆会出错

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 行情/资金流/发送日志存在 SQLite 里（含"近5日主力合计"的本地累积）。
      # GitHub 的 runner 是一次性的，用 Actions 缓存把数据库带过去，
      # key 带 run_id 保证每次运行后都会存一份新快照，restore-keys 恢复最近一份。
      - name: 恢复行情数据库
        uses: actions/cache@v4
        with:
          path: jiaomei_tracker/data
          key: tracker-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tracker-data-v1-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 凭证从仓库 Secrets 生成 .env（wechat_pusher 启动时自动读取，
      # 真实环境变量优先，不会覆盖 Secrets 注入的值）。.env 永远不进 git。
      - name: 生成凭证文件
        run: |
          printf 'QQ_BOT_APPID=%s\nQQ_BOT_SECRET=%s\nQQ_BOT_USER_OPENID=%s\n' \
            "${{ secrets.QQ_BOT_APPID }}" \
            "${{ secrets.QQ_BOT_SECRET }}" \
            "${{ secrets.QQ_BOT_USER_OPENID }}" > wechat_pusher/.env
          if grep -q '=$' wechat_pusher/.env; then
            echo "::error::存在空的 Secret，请到仓库 Settings -> Secrets and variables -> Actions 检查 QQ_BOT_APPID / QQ_BOT_SECRET / QQ_BOT_USER_OPENID 三个值是否都已填写"
            exit 1
          fi
          echo "凭证文件已生成（未回显内容，长度：$(wc -c < wechat_pusher/.env) 字节）"

      # 时段优先用**触发它的那条 cron 原文**判定，而不是按当前时间猜：
      # 定时任务会有几分钟排队延迟，按时间猜会把 9:35 的开盘跑误判成"上午十点"。
      - name: 确定运行参数
        id: plan
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            '37 1 * * 1-5'|'35 1 * * 1-5') SLOT=market_open ;;
            '3 2 * * 1-5'|'0 2 * * 1-5')   SLOT=morning_ten ;;
            '4 7 * * 1-5'|'2 7 * * 1-5')   SLOT=market_close ;;
            *) SLOT="${{ github.event.inputs.slot }}" ;;
          esac
          if [ -z "$SLOT" ]; then
            BJ=$(TZ=Asia/Shanghai date +%H%M)
            case "$BJ" in
              09*) SLOT=market_open ;;
              10*) SLOT=morning_ten ;;
              *)   SLOT=market_close ;;
            esac
          fi

          FORCE=no
          RESET=no
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "$COMMIT_MSG" in
              # 强制重发：跳过去重，明知会重复也照发
              *'DAILY-RESEND:market_open'*)  MODE='正式推送'; SLOT=market_open;  FORCE=yes ;;
              *'DAILY-RESEND:morning_ten'*)  MODE='正式推送'; SLOT=morning_ten;  FORCE=yes ;;
              *'DAILY-RESEND:market_close'*) MODE='正式推送'; SLOT=market_close; FORCE=yes ;;
              # 幂等补发：当天该时段已推送过则自动跳过。
              # 这样"保底补发"可以无脑重复触发，绝不会造成重复消息。
              *'DAILY-SEND:market_open'*)    MODE='正式推送'; SLOT=market_open;  FORCE=no ;;
              *'DAILY-SEND:morning_ten'*)    MODE='正式推送'; SLOT=morning_ten;  FORCE=no ;;
              *'DAILY-SEND:market_close'*)   MODE='正式推送'; SLOT=market_close; FORCE=no ;;
              *) MODE='只做诊断' ;;
            esac
            if printf '%s' "$COMMIT_MSG" | grep -q 'DAILY-RESET-DEDUP'; then RESET=yes; fi
          fi
          if [ -z "$MODE" ]; then MODE='正式推送'; fi
          # 失败方向必须安全：只有**明确**是「正式推送」才真发消息；
          # 其余情况（取值异常、拼写不一致、编码被破坏）一律按诊断处理，绝不误发。
          # 注：workflow_dispatch 未传 mode 时，github.event.inputs.mode 会自动取到默认值「正式推送」，
          #     所以外部定时器只传 slot（或全不传）即可正常出报。
          if [ "$MODE" = '正式推送' ]; then DIAG=no; else DIAG=yes; fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "diag=$DIAG" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "reset=$RESET" >> "$GITHUB_OUTPUT"
          echo "时段=$SLOT  方式=$MODE  补发跳过去重=$FORCE  重置去重=$RESET  触发=${{ github.event_name }}"

      # 维护动作：清掉云端当日 send_log（去重键），行情与资金流历史保留。
      # 用途：手动补发后不想让当天的定时推送被误判成"已发送过"。
      - name: 重置当日去重记录
        if: steps.plan.outputs.reset == 'yes'
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd jiaomei_tracker
          python - <<'PY' 2>&1 | tee /tmp/reset.log
          import sqlite3, datetime, pathlib
          p = pathlib.Path('data/tracker.db')
          if not p.exists():
              print('数据库不存在，无需重置')
              raise SystemExit(0)
          today = datetime.date.today().strftime('%Y-%m-%d')
          c = sqlite3.connect(p)
          rows = c.execute("SELECT slot_id,channel,status FROM send_log WHERE trade_date=?", (today,)).fetchall()
          print('重置前今日记录:', rows)
          n = c.execute("DELETE FROM send_log WHERE trade_date=?", (today,)).rowcount
          c.commit()
          print(f'已清空今日去重记录 {n} 条（仅 send_log；行情与资金流历史保留）')
          PY

      # 真取一次 access_token（不发消息）：同时验证「Secrets 配全了」和「云端能连上 QQ 接口」
      - name: 凭证自检
        id: selfcheck
        continue-on-error: true
        run: |
          set -o pipefail
          cd wechat_pusher
          python send.py --only qq_bot --check 2>&1 | tee /tmp/selfcheck.log

      # ---------- 诊断模式：只验链路，不发日报 ----------
      - name: 取数自检（dry-run，不发送、不落库）
        id: diyrun
        if: steps.plan.outputs.diag == 'yes'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd jiaomei_tracker
          python run.py --slot "${{ steps.plan.outputs.slot }}" --dry-run --force 2>&1 | tee /tmp/daily.log

      # 诊断只在**确实出问题**时才打扰用户：凭证或取数任一失败才发 QQ 告警。
      - name: 诊断失败才告警到 QQ
        if: steps.plan.outputs.diag == 'yes'
        continue-on-error: true
        run: |
          CRED_OK=$(grep -c '\[OK\]' /tmp/selfcheck.log 2>/dev/null || true)
          QUOTE_OK=$(grep -c '行情取数成功' /tmp/daily.log 2>/dev/null || true)
          if [ "$CRED_OK" -gt 0 ] && [ "$QUOTE_OK" -gt 0 ]; then
            echo "云端诊断通过（凭证与取数均正常），按设计不发送消息"
            exit 0
          fi
          BJ=$(TZ=Asia/Shanghai date '+%F %T')
          CRED=$(grep -v '^[[:space:]]*$' /tmp/selfcheck.log 2>/dev/null | tail -1)
          LAST=$(grep -v '^[[:space:]]*$' /tmp/daily.log 2>/dev/null | tail -1)
          {
            echo "时间：$BJ"
            echo "凭证自检：${CRED:-无输出}"
            echo "取数结果：${LAST:-无输出}"
            echo "（这是云端自检失败告警；正常时不会发消息）"
          } > /tmp/diag.txt
          cd wechat_pusher
          python send.py --only qq_bot --title "⚠️ 云端自检异常" --text "$(cat /tmp/diag.txt)"

      # ---------- 正式模式：正常出日报并推送 ----------
      # 手动补发（带 DAILY-SEND 标记）时加 --force：越过交易日守卫与发送去重，
      # 保证"让发就一定发得出去"；定时任务永远不加 --force。
      - name: 运行日报（正式推送）
        id: run
        if: steps.plan.outputs.diag != 'yes'
        env:
          PYTHONIOENCODING: utf-8
          FORCE: ${{ steps.plan.outputs.force }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ "$FORCE" = "yes" ]; then EXTRA="--force"; fi
          cd jiaomei_tracker
          python run.py --slot "${{ steps.plan.outputs.slot }}" $EXTRA 2>&1 | tee /tmp/daily.log

      # 把本次结果写回仓库。即使上一步失败也执行（if: always()），
      # 且自身失败不拖累整个任务（continue-on-error），只做诊断用。
      - name: 回写运行状态
        if: always()
        continue-on-error: true
        env:
          SLOT: ${{ steps.plan.outputs.slot }}
          DIAG: ${{ steps.plan.outputs.diag }}
          FORCE: ${{ steps.plan.outputs.force }}
          RESET: ${{ steps.plan.outputs.reset }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p status
          BJ_NOW=$(TZ=Asia/Shanghai date '+%F %T')
          LAST_LINE=$(grep -v '^[[:space:]]*$' /tmp/daily.log 2>/dev/null | tail -1)
          CRED_LINE=$(grep -v '^[[:space:]]*$' /tmp/selfcheck.log 2>/dev/null | tail -1)
          {
            echo "北京时间: $BJ_NOW"
            echo "时段: ${SLOT:-未确定}"
            echo "方式: $([ "$DIAG" = "yes" ] && echo 诊断 || echo 正式推送)（补发跳过去重: $FORCE，重置去重: $RESET）"
            echo "触发: ${{ github.event_name }}"
            echo "任务结果: ${{ job.status }}"
            echo "重置去重: $(grep -v '^[[:space:]]*$' /tmp/reset.log 2>/dev/null | tail -1 || echo '（未执行）')"
            echo "凭证自检: ${CRED_LINE:-（无输出）}"
            echo "末尾输出: ${LAST_LINE:-（无日志）}"
            echo "运行页: $RUN_URL"
          } > status/last-run.txt
          tail -n 40 /tmp/daily.log > status/last-log-tail.txt 2>/dev/null || true
          cp /tmp/diag.txt status/last-diag.txt 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          if git diff --cached --quiet; then
            echo "状态无变化，无需提交"
            exit 0
          fi
          git commit -q -m "运行状态 $SLOT $BJ_NOW"
          # 并发运行或人工推送会让远端前进，直接推会被拒 → 兜底 rebase 后重推
          if git push -q origin HEAD:main 2>/dev/null; then
            echo "状态已回写"
          else
            echo "推送被拒，改为 rebase 后重推"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            echo "状态已回写（rebase 兜底）"
          fi
